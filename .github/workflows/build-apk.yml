name: 打包安卓 APK
# 手动运行：仓库 → Actions → 打包安卓 APK → Run workflow
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 取代码
        uses: actions/checkout@v4
      - name: 装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 装 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: 检查 Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls "$ANDROID_HOME" || true
          which sdkmanager || true
      - name: 准备网页资源
        run: |
          set -e
          mkdir -p mobile/www
          cp index.html mobile/www/index.html
          cp -r css js mobile/www/ 2>/dev/null || true
          cp icon-192.png icon-512.png manifest.webmanifest sw.js mobile/www/ 2>/dev/null || true
          if grep -q 'id="landing"' mobile/www/index.html; then
            node -e "
              const fs = require('fs');
              const p = 'mobile/www/index.html';
              let s = fs.readFileSync(p, 'utf8');
              s = s.replace(/var showLanding = [^;]+;/, 'var showLanding = false;');
              fs.writeFileSync(p, s);
              console.log('已关闭 APK 内的下载页');
            "
          fi
          ls -la mobile/www
      - name: 安装 Capacitor 并生成安卓工程
        working-directory: mobile
        run: |
          set -e
          npm init -y
          npm install --no-audit --no-fund @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "双人麻将" "com.mahjong.two" --web-dir=www
          npx cap add android
          npx cap sync android
      - name: 设置横屏
        run: |
          MANI="mobile/android/app/src/main/AndroidManifest.xml"
          node -e "
            const fs = require('fs');
            const p = process.argv[1];
            let s = fs.readFileSync(p, 'utf8');
            s = s.replace(/android:screenOrientation=\"[a-zA-Z]+\"/g, 'android:screenOrientation=\"sensorLandscape\"');
            if (s.indexOf('android:screenOrientation') === -1) {
              s = s.replace('<activity ', '<activity android:screenOrientation=\"sensorLandscape\" ');
            }
            fs.writeFileSync(p, s);
            console.log('screenOrientation 设置完成');
          " "$MANI"
          grep -n "screenOrientation" "$MANI" || true
      - name: 编译 APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: 双人麻将-APK
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: 发布 Release
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: 双人麻将 APK #${{ github.run_number }}
          files: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
